name: Verify and deploy GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Test Chrome Web Store submission safeguards
        run: npm run test:store

      - name: Run Firestore security rules tests
        run: npm run test:rules

      - name: Check types
        run: npm run typecheck

      - name: Validate Pages deployment configuration
        if: github.event_name != 'pull_request' && vars.ENABLE_PAGES_DEPLOY == 'true'
        env:
          VITE_PLAYER_USER_CODE: ${{ vars.VITE_PLAYER_USER_CODE }}
          VITE_DEPLOYMENT_VISIBILITY: ${{ vars.VITE_DEPLOYMENT_VISIBILITY }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_CONNECTOR_ORIGINS: ${{ vars.VITE_CONNECTOR_ORIGINS }}
          VITE_CONNECTOR_STORE_ID: ${{ vars.VITE_CONNECTOR_STORE_ID }}
        run: >-
          node -e 'const required=["VITE_PLAYER_USER_CODE","VITE_DEPLOYMENT_VISIBILITY","VITE_FIREBASE_API_KEY","VITE_FIREBASE_AUTH_DOMAIN","VITE_FIREBASE_PROJECT_ID","VITE_FIREBASE_APP_ID","VITE_CONNECTOR_ORIGINS"];
          const missing=required.filter(key=>!process.env[key]);
          if(missing.length){console.error(`Missing repository variables: ${missing.join(", ")}`); process.exit(1)}'

      - name: Validate Chrome Web Store configuration
        if: github.event_name == 'push' && vars.ENABLE_CHROME_STORE_PUBLISH == 'true'
        env:
          VITE_CONNECTOR_ORIGINS: ${{ vars.VITE_CONNECTOR_ORIGINS }}
          VITE_CONNECTOR_STORE_ID: ${{ vars.VITE_CONNECTOR_STORE_ID }}
          CHROME_STORE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CHROME_STORE_WORKLOAD_IDENTITY_PROVIDER }}
          CHROME_STORE_SERVICE_ACCOUNT: ${{ vars.CHROME_STORE_SERVICE_ACCOUNT }}
          CHROME_STORE_PUBLISHER_ID: ${{ vars.CHROME_STORE_PUBLISHER_ID }}
        run: >-
          node -e 'const keys=["VITE_CONNECTOR_ORIGINS","VITE_CONNECTOR_STORE_ID","CHROME_STORE_WORKLOAD_IDENTITY_PROVIDER","CHROME_STORE_SERVICE_ACCOUNT","CHROME_STORE_PUBLISHER_ID"];
          const missing=keys.filter(key=>!process.env[key]);
          if(missing.length){console.error(`Missing repository variables: ${missing.join(", ")}`); process.exit(1)}'

      - name: Build application and Chrome connector
        run: npm run build
        env:
          VITE_PLAYER_USER_CODE: ${{ vars.VITE_PLAYER_USER_CODE }}
          VITE_DEPLOYMENT_VISIBILITY: ${{ vars.VITE_DEPLOYMENT_VISIBILITY }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_CONNECTOR_ORIGINS: ${{ vars.VITE_CONNECTOR_ORIGINS }}
          VITE_CONNECTOR_STORE_ID: ${{ vars.VITE_CONNECTOR_STORE_ID }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && vars.ENABLE_PAGES_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Upload verified Chrome Web Store package
        if: github.event_name == 'push' && vars.ENABLE_CHROME_STORE_PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: chrome-store-package
          path: dist/sf6-battlegraph-connector-store-v*.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && vars.ENABLE_PAGES_DEPLOY == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  chrome-store:
    if: github.event_name == 'push' && vars.ENABLE_CHROME_STORE_PUBLISH == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          name: chrome-store-package
          path: dist
      - name: Authenticate without a service-account key
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CHROME_STORE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CHROME_STORE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Submit newer connector version for review
        run: node scripts/chrome-store.mjs
        env:
          CHROME_STORE_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CHROME_STORE_PUBLISHER_ID: ${{ vars.CHROME_STORE_PUBLISHER_ID }}
          CHROME_STORE_ITEM_ID: ${{ vars.VITE_CONNECTOR_STORE_ID }}
